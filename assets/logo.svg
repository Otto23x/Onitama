<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Ensō: il cerchio a pennello, simbolo di forma e movimento -->
  <g transform="translate(62, 65)">
    <circle r="42" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="225 40" transform="rotate(-70)" filter="url(#glow)"/>
    <circle r="42" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"
            stroke-dasharray="80 185" transform="rotate(-60)" opacity="0.6"/>
    <!-- tre passi: la traiettoria di una forma -->
    <rect x="-16" y="-6" width="12" height="12" rx="2.5" fill="#f5f0eb"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2.5" fill="#f59e0b"/>
    <rect x="4" y="-16" width="12" height="12" rx="2.5" fill="#f5f0eb"/>
  </g>
  <text x="130" y="80" font-family="'Cinzel', 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="66" font-weight="900"
        fill="url(#goldGrad)" letter-spacing="12" filter="url(#glow)">KATA</text>
  <text x="134" y="106" font-family="sans-serif" font-size="12" font-weight="600" fill="#a89f91" letter-spacing="4.5">L'ARTE DELLE FORME</text>
</svg>
